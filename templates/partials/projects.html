{% set resume = load_data(path="data/resume.toml") %}
<section class="section" id="projects" aria-labelledby="projects-label">
  <div class="section-intro">
    <h2 class="section-label" id="projects-label"><span class="section-num">04</span> Independent Work</h2>
    <p class="section-note">A project outside the day job.</p>
  </div>
  <div class="section-content project-list">
    {% for project in resume.projects %}
    <article class="project-entry">
      <h3>{% if project.url %}<a href="{{ project.url }}">{{ project.name }} <span aria-hidden="true">↗</span></a>{% else %}{{ project.name }}{% endif %}</h3>
      <p>{{ project.summary }}</p>
    </article>
    {% endfor %}
  </div>
</section>
